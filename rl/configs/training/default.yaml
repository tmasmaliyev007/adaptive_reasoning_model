num_epochs:                  3
num_generations:             8

per_device_train_batch_size: 8
gradient_accumulation_steps: 4

kl_coef:                     1e-3
warmup_ratio:                0.1
learning_rate:               2e-4
lr_scheduler_type:           "cosine"
max_grad_norm:               1.0
    
fp16:                        false
bf16:                        true
logging_steps:               200
eval_steps:                  null
metric_for_best_model:       null
    
load_best_model_at_end:      false
greater_is_better:           false
    
optim:                       "adamw_8bit"
weight_decay:                0.01