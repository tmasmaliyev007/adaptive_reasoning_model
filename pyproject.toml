[project]
name = "adaptive-reasoning-model"
version = "1.0.0"
description = "Adaptive Reasoning Model - Task-aware reasoning for LLMs using GRPO"
requires-python = ">=3.10"

dependencies = [
    "unsloth",
    "hydra-core",
    "omegaconf",
    "python-dotenv",
    "wandb",
    "flash-attn"
]

[tool.setuptools.packages.find]
include = ["sft*"]

[tool.uv.sources]
unsloth = { path = "libs/unsloth", editable = false }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.8cxx11abiTRUE-cp310-cp310-linux_x86_64.whl" }

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"